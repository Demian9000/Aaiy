  <h1>
    Мұхтар Әуезов
  </h1>
  <p>Мұхтар Әуезов(1897-1961)-жазушы, драматург, ғалым, «Абай жолы» роман-эпопеясының авторы.</p>
  <p>Ол Семей өңірінде, Шыңғыстау баурайында дүниеге келген.</p>
  <h2>Негізгі шығармалары</h2>
  <ul>
    <li>«Абай жолы»</li>
    <li>«Қараш-Қараш оқиғасы»</li>
    <li>«Көксерек»</li>
  </ul>
</body>
